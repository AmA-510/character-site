<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수정툴</title><style>body{margin:0;background:#22212a;color:#d8d5c6;font-family:system-ui}.w{max-width:980px;margin:auto;padding:32px 20px}section{border-top:1px solid #565260;padding:26px 0}input,textarea{box-sizing:border-box;width:100%;background:#292834;color:#d8d5c6;border:1px solid #565260;padding:10px;margin:6px 0;font:inherit}textarea{min-height:90px}button{cursor:pointer;border:0;padding:9px 12px;margin:6px 5px 0 0;background:#d8d5c6;color:#22212a}.danger{background:#7b4654;color:#fff}.card{border:1px solid #565260;padding:14px;margin:12px 0}.card img{width:110px;height:110px;object-fit:cover;float:right;margin-left:12px}.muted{color:#aaa7a0}.notice{color:#b9a9d9}</style><body><div class="w"><p class="muted">CONTENT STUDIO</p><h1>수정툴</h1><p>항목을 수정한 뒤 마지막에 저장하세요. 삭제한 항목은 캐릭터사이트에서만 사라지고 원본 이미지 파일은 남습니다.</p><section><h2>기본 정보</h2><input id="title" placeholder="사이트 제목"><textarea id="hero" placeholder="메인 소개"></textarea></section><section><h2>캐릭터 프로필</h2><button onclick="add('profiles')">캐릭터 추가</button><div id="profiles"></div></section><section><h2>갤러리</h2><input id="galleryFile" type="file" accept="image/*"><button onclick="upload('gallery')">이미지 추가</button><div id="gallery"></div></section><section><h2>세계관 도감</h2><button onclick="add('entries')">문서 추가</button><div id="entries"></div></section><button onclick="save()">모든 변경사항 저장</button><span id="notice" class="notice"></span></div><script>let d;const $=x=>document.getElementById(x),say=x=>$('notice').textContent=x;function field(v,k,p=''){return `<input data-k="${k}" value="${v||''}" placeholder="${p}">`}function area(v,k,p=''){return `<textarea data-k="${k}" placeholder="${p}">${v||''}</textarea>`}function card(type,x,i){let image=type==='profiles'&&x.image?`<img src="${x.image}">`:type==='gallery'&&x.url?`<img src="${x.url}">`:'';let body=type==='entries'?field(x.type,'type','분류')+field(x.title,'title','제목')+area(x.text,'text','내용')+field((x.links||[]).join(', '),'links','연결 문서 제목, 쉼표로 구분'):field(x.name,'name','이름')+field(x.summary,'summary','짧은 소개')+area(x.story,'story','상세 설명');if(type==='gallery')body=field(x.title,'title','제목')+area(x.story,'story','이야기');return `<div class="card" data-type="${type}" data-i="${i}">${image}${body}${type==='profiles'?'<input class="img" type="file" accept="image/*">':''}<button onclick="removeItem('${type}',${i})" class="danger">삭제</button></div>`}function draw(){ $('title').value=d.site.title;$('hero').value=d.site.heroLines.join('\n');['profiles','gallery','entries'].forEach(t=>$(t).innerHTML=(d[t]||[]).map((x,i)=>card(t,x,i)).join(''))}function add(t){let x=t==='profiles'?{id:crypto.randomUUID(),name:'',summary:'',story:'',image:''}:t==='gallery'?{url:'',title:'',story:''}:{id:crypto.randomUUID(),type:'문서',title:'',text:'',links:[]};d[t].push(x);draw()}function removeItem(t,i){d[t].splice(i,1);draw()}async function upload(t){let f=$('galleryFile').files[0];if(!f)return say('이미지를 선택해 주세요.');let fd=new FormData;fd.append('image',f);let r=await fetch('/api/image',{method:'POST',body:fd}),o=await r.json();if(!r.ok)return say(o.error);d.gallery.push({url:o.url,title:f.name,story:''});draw()}function values(){document.querySelectorAll('.card').forEach(async c=>{let x=d[c.dataset.type][c.dataset.i];c.querySelectorAll('[data-k]').forEach(e=>x[e.dataset.k]=e.value);if(x.links)x.links=x.links.split(',').map(v=>v.trim()).filter(Boolean);let file=c.querySelector('.img')?.files[0];if(file){let fd=new FormData;fd.append('image',file);let r=await fetch('/api/image',{method:'POST',body:fd}),o=await r.json();x.image=o.url}})}async function save(){values();d.site.title=$('title').value;d.site.heroLines=$('hero').value.split('\n').filter(Boolean);await new Promise(r=>setTimeout(r,300));let r=await fetch('/api/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});say(r.ok?'저장됐습니다. 캐릭터사이트를 새로고침하세요.':'저장 실패')}fetch('/api/content').then(r=>r.json()).then(x=>{d=x;d.profiles||=[];d.gallery||=[];d.entries||=[];draw()})</script></body></html>
